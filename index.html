<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #E6F7FF 0%, #FFF0F5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            color: #5a5a5a;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        header {
            margin: 20px 0;
            animation: fadeInDown 1s ease;
        }

        h1 {
            font-size: 2.2rem;
            color: #88c9d5;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 1rem;
            color: #a8a8a8;
            margin-bottom: 20px;
        }

        .controls {
            background-color: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            animation: slideInUp 0.8s ease;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            color: #88c9d5;
        }

        input, select, button {
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background-color: white;
            color: #5a5a5a;
            transition: all 0.3s ease;
        }

        button {
            background-color: #FFD1DC;
            color: #5a5a5a;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            position: relative;
            overflow: hidden;
        }

        button:hover, button:active {
            background-color: #FFB6C1;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        button:disabled {
            background-color: #e0e0e0;
            color: #a8a8a8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        button:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            animation: fadeIn 1s ease;
        }

        .info-box {
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px 15px;
            border-radius: 10px;
            text-align: center;
            flex: 1;
            margin: 0 5px;
            color: #5a5a5a;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .info-box:hover {
            transform: translateY(-3px);
        }

        .memory-game {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            margin: 0 auto;
            animation: zoomIn 0.8s ease;
        }

        .card {
            aspect-ratio: 3/4;
            background-color: #FFF9F0;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            animation: matchedAnimation 0.8s ease;
            visibility: visible;
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card-front {
            background-color: #FFF9F0;
            transform: rotateY(180deg);
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .card-front img {
            transform: scale(1.05);
        }

        .card-front .emoji {
            font-size: 2rem;
            transition: transform 0.3s ease;
        }

        .card:hover .card-front .emoji {
            transform: scale(1.2);
        }

        .card-back {
            background: linear-gradient(45deg, #FFE6F0, #FFD1DC);
            color: #5a5a5a;
            font-size: 1.5rem;
        }

        .card-back::before {
            content: '?';
            animation: pulse 2s infinite;
        }

        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            max-width: 100%;
        }

        .image-preview img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
            border: 2px solid #FFD1DC;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .image-preview img:hover {
            transform: scale(1.1);
        }

        .message {
            padding: 8px;
            border-radius: 5px;
            margin-top: 5px;
            text-align: center;
            font-size: 14px;
            animation: fadeIn 0.5s ease;
        }

        .error {
            background-color: rgba(255, 182, 193, 0.3);
            color: #d46a7e;
        }

        .success {
            background-color: rgba(136, 201, 213, 0.3);
            color: #5a9aa8;
        }

        .win-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            animation: fadeIn 0.5s ease;
        }

        .win-content {
            background: linear-gradient(135deg, #FFF9F0 0%, #FFE6F0 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: bounceIn 0.8s ease;
        }

        .win-content h2 {
            font-size: 1.8rem;
            color: #88c9d5;
            margin-bottom: 15px;
        }

        .win-content p {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #5a5a5a;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #FFD1DC;
            opacity: 0;
            z-index: 99;
        }

        /* Animações */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 1;
            }
            20% {
                transform: scale(25, 25);
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(40, 40);
            }
        }

        @keyframes matchedAnimation {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.2); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        /* Ajustes para telas muito pequenas */
        @media (max-width: 350px) {
            .memory-game {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .card-front .emoji {
                font-size: 1.5rem;
            }
            
            .card-back {
                font-size: 1.2rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }

        /* Ajustes para modo paisagem em celulares */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 10px;
            }
            
            .container {
                max-width: 100%;
            }
            
            .controls {
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .control-group {
                flex: 1;
                min-width: 150px;
            }
            
            .memory-game {
                grid-template-columns: repeat(6, 1fr);
            }
            
            .card {
                aspect-ratio: 1/1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Jogo da Memória</h1>
            <p class="subtitle">Exercite sua mente encontrando os pares!</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="imageUpload">Carregar Imagens (opcional):</label>
                <input type="file" id="imageUpload" accept="image/*" multiple>
                <div class="image-preview" id="imagePreview"></div>
                <div id="uploadMessage" class="message"></div>
            </div>
            
            <div class="control-group">
                <label for="gridSize">Tamanho do Tabuleiro:</label>
                <select id="gridSize">
                    <option value="4">2x2 (4 cartas)</option>
                    <option value="6">3x2 (6 cartas)</option>
                    <option value="8" selected>4x2 (8 cartas)</option>
                    <option value="12">4x3 (12 cartas)</option>
                    <option value="16">4x4 (16 cartas)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="theme">Tema:</label>
                <select id="theme">
                    <option value="default">Padrão</option>
                    <option value="nature">Natureza</option>
                    <option value="animals">Animais</option>
                    <option value="food">Comida</option>
                    <option value="sports">Esportes</option>
                    <option value="travel">Viagem</option>
                </select>
            </div>
            
            <button id="startGame">Iniciar Jogo</button>
            <button id="resetGame">Reiniciar</button>
        </div>
        
        <div class="game-info">
            <div class="info-box">
                <p>Movimentos: <span id="moves">0</span></p>
            </div>
            <div class="info-box">
                <p>Pares: <span id="pairs">0</span>/<span id="totalPairs">0</span></p>
            </div>
            <div class="info-box">
                <p>Tempo: <span id="timer">0</span>s</p>
            </div>
        </div>
        
        <div class="memory-game" id="memoryGame"></div>
    </div>
    
    <div class="win-message" id="winMessage">
        <div class="win-content">
            <h2>Parabéns! 🎉</h2>
            <p>Você completou o jogo!</p>
            <p>Movimentos: <span id="finalMoves">0</span></p>
            <p>Tempo: <span id="finalTime">0</span> segundos</p>
            <button id="playAgain">Jogar Novamente</button>
        </div>
    </div>

    <script>
        // Elementos do DOM
        const memoryGame = document.getElementById('memoryGame');
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const uploadMessage = document.getElementById('uploadMessage');
        const gridSize = document.getElementById('gridSize');
        const theme = document.getElementById('theme');
        const startGame = document.getElementById('startGame');
        const resetGame = document.getElementById('resetGame');
        const movesDisplay = document.getElementById('moves');
        const pairsDisplay = document.getElementById('pairs');
        const totalPairsDisplay = document.getElementById('totalPairs');
        const timerDisplay = document.getElementById('timer');
        const winMessage = document.getElementById('winMessage');
        const finalMoves = document.getElementById('finalMoves');
        const finalTime = document.getElementById('finalTime');
        const playAgain = document.getElementById('playAgain');

        // Variáveis do jogo
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval;
        let gameStarted = false;
        let userImages = [];

        // Imagens padrão por tema
        const defaultImages = {
            default: ['😀', '🎮', '🚀', '⭐', '🐱', '🐶', '🐼', '🐯', '🎨', '🎭', '🎪', '🎯', '🧩', '🎲', '♟️', '🎳'],
            nature: ['🌲', '🌻', '🌊', '⛰️', '🌈', '☀️', '🌙', '⭐', '🌸', '🍂', '❄️', '🌧️', '🌪️', '🌄', '🏞️', '🌺'],
            animals: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔'],
            food: ['🍎', '🍌', '🍇', '🍓', '🍕', '🍔', '🌭', '🍿', '🍩', '🍪', '🍰', '🧁', '🍦', '🍫', '🍬', '🍭'],
            sports: ['⚽', '🏀', '🎾', '🏐', '🎯', '🏓', '🥊', '🏈', '⚾', '🎱', '🏒', '🏸', '🏊', '🚴', '🤸', '🏅'],
            travel: ['🚗', '✈️', '🚂', '🚢', '🏝️', '🏔️', '🏰', '🎡', '🗽', '🗼', '🏯', '🌋', '🏕️', '⛺', '🚁', '🚀']
        };

        // Event Listeners
        startGame.addEventListener('click', initializeGame);
        resetGame.addEventListener('click', resetGameState);
        playAgain.addEventListener('click', () => {
            winMessage.style.display = 'none';
            resetGameState();
        });

        imageUpload.addEventListener('change', handleImageUpload);

        // Função para carregar imagens do usuário
        function handleImageUpload(event) {
            const files = event.target.files;
            userImages = [];
            imagePreview.innerHTML = '';
            uploadMessage.textContent = '';
            
            if (files.length > 0) {
                let loadedImages = 0;
                const totalImages = files.length;
                
                for (let i = 0; i < files.length; i++) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        userImages.push({
                            id: i,
                            src: e.target.result
                        });
                        
                        // Mostrar preview da imagem
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.alt = `Imagem ${i+1}`;
                        imagePreview.appendChild(img);
                        
                        loadedImages++;
                        
                        // Verificar se todas as imagens foram carregadas
                        if (loadedImages === totalImages) {
                            uploadMessage.textContent = `${userImages.length} imagens carregadas. Opcional: iniciar jogo com tema selecionado.`;
                            uploadMessage.className = 'message success';
                        }
                    };
                    reader.onerror = function() {
                        uploadMessage.textContent = 'Erro ao carregar uma das imagens.';
                        uploadMessage.className = 'message error';
                    };
                    reader.readAsDataURL(files[i]);
                }
            } else {
                uploadMessage.textContent = 'Nenhuma imagem carregada. O jogo usará o tema selecionado.';
                uploadMessage.className = 'message';
            }
        }

        // Inicializar o jogo
        function initializeGame() {
            resetGameState();
            
            const selectedGridSize = parseInt(gridSize.value);
            const selectedTheme = theme.value;
            
            // Determinar o número de pares
            totalPairs = selectedGridSize / 2;
            totalPairsDisplay.textContent = totalPairs;
            
            // Obter imagens para o jogo
            let gameImages = [];
            
            if (userImages.length >= totalPairs) {
                // Usar imagens do usuário
                gameImages = userImages.slice(0, totalPairs).map(img => img.src);
            } else {
                // Usar imagens padrão do tema selecionado
                const themeImages = defaultImages[selectedTheme] || defaultImages.default;
                gameImages = themeImages.slice(0, totalPairs);
                
                // Se não há imagens suficientes, repetir algumas
                while (gameImages.length < totalPairs) {
                    gameImages.push(...themeImages.slice(0, totalPairs - gameImages.length));
                }
            }
            
            // Duplicar as imagens para formar pares
            cards = [...gameImages, ...gameImages];
            
            // Embaralhar as cartas
            shuffleCards();
            
            // Criar o tabuleiro do jogo
            createBoard(selectedGridSize);
            
            // Iniciar o temporizador
            startTimer();
            gameStarted = true;
            
            // Efeito visual de início
            memoryGame.style.animation = 'none';
            setTimeout(() => {
                memoryGame.style.animation = 'zoomIn 0.8s ease';
            }, 10);
        }

        // Embaralhar as cartas
        function shuffleCards() {
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
        }

        // Criar o tabuleiro do jogo
        function createBoard(size) {
            memoryGame.innerHTML = '';
            const columns = Math.sqrt(size);
            memoryGame.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
            
            for (let i = 0; i < size; i++) {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.index = i;
                card.dataset.value = cards[i];
                
                const cardFront = document.createElement('div');
                cardFront.classList.add('card-front');
                
                // Verificar se é uma imagem (data URL) ou um emoji
                if (typeof cards[i] === 'string' && cards[i].startsWith('data:image')) {
                    const img = document.createElement('img');
                    img.src = cards[i];
                    img.alt = `Imagem ${i}`;
                    cardFront.appendChild(img);
                } else {
                    const emojiSpan = document.createElement('span');
                    emojiSpan.textContent = cards[i];
                    emojiSpan.classList.add('emoji');
                    cardFront.appendChild(emojiSpan);
                }
                
                const cardBack = document.createElement('div');
                cardBack.classList.add('card-back');
                
                card.appendChild(cardFront);
                card.appendChild(cardBack);
                
                card.addEventListener('click', flipCard);
                memoryGame.appendChild(card);
            }
        }

        // Virar uma carta
        function flipCard() {
            if (!gameStarted) return;
            
            const card = this;
            
            // Não permitir virar cartas já viradas ou combinadas
            if (card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }
            
            // Não permitir virar mais de duas cartas ao mesmo tempo
            if (flippedCards.length >= 2) {
                return;
            }
            
            // Efeito de clique
            card.style.transform = 'scale(0.95)';
            setTimeout(() => {
                card.style.transform = '';
            }, 150);
            
            // Virar a carta
            card.classList.add('flipped');
            flippedCards.push(card);
            
            // Verificar se duas cartas foram viradas
            if (flippedCards.length === 2) {
                moves++;
                movesDisplay.textContent = moves;
                
                // Efeito no contador de movimentos
                movesDisplay.parentElement.style.animation = 'none';
                setTimeout(() => {
                    movesDisplay.parentElement.style.animation = 'pulse 0.5s ease';
                }, 10);
                
                checkForMatch();
            }
        }

        // Verificar se as cartas viradas formam um par
        function checkForMatch() {
            const [card1, card2] = flippedCards;
            const value1 = card1.dataset.value;
            const value2 = card2.dataset.value;
            
            if (value1 === value2) {
                // Cartas combinam
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    flippedCards = [];
                    
                    matchedPairs++;
                    pairsDisplay.textContent = matchedPairs;
                    
                    // Efeito no contador de pares
                    pairsDisplay.parentElement.style.animation = 'none';
                    setTimeout(() => {
                        pairsDisplay.parentElement.style.animation = 'pulse 0.5s ease';
                    }, 10);
                    
                    // Verificar se o jogo terminou
                    if (matchedPairs === totalPairs) {
                        endGame();
                    }
                }, 500);
            } else {
                // Cartas não combinam - efeito de shake
                setTimeout(() => {
                    card1.classList.add('shake');
                    card2.classList.add('shake');
                    
                    setTimeout(() => {
                        card1.classList.remove('flipped', 'shake');
                        card2.classList.remove('flipped', 'shake');
                        flippedCards = [];
                    }, 500);
                }, 1000);
            }
        }

        // Iniciar o temporizador
        function startTimer() {
            timer = 0;
            timerDisplay.textContent = timer;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer++;
                timerDisplay.textContent = timer;
            }, 1000);
        }

        // Finalizar o jogo
        function endGame() {
            clearInterval(timerInterval);
            gameStarted = false;
            
            finalMoves.textContent = moves;
            finalTime.textContent = timer;
            
            // Efeito de confete
            createConfetti();
            
            setTimeout(() => {
                winMessage.style.display = 'flex';
            }, 1000);
        }

        // Criar efeito de confete
        function createConfetti() {
            const colors = ['#FFD1DC', '#88c9d5', '#FFB6C1', '#A8E6CF', '#FFCC5C'];
            const confettiCount = 50;
            
            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);
                
                // Animação do confete
                const animation = confetti.animate([
                    { top: '-10px', opacity: 1, transform: 'rotate(0deg)' },
                    { top: '100vh', opacity: 0, transform: 'rotate(360deg)' }
                ], {
                    duration: Math.random() * 3000 + 2000,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
                });
                
                animation.onfinish = () => {
                    confetti.remove();
                };
            }
        }

        // Reiniciar o jogo
        function resetGameState() {
            clearInterval(timerInterval);
            memoryGame.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            timer = 0;
            
            movesDisplay.textContent = moves;
            pairsDisplay.textContent = matchedPairs;
            timerDisplay.textContent = timer;
            totalPairsDisplay.textContent = '0';
            
            gameStarted = false;
            
            // Remover confetes
            document.querySelectorAll('.confetti').forEach(confetti => confetti.remove());
        }

        // Inicializar com um jogo padrão
        window.addEventListener('DOMContentLoaded', () => {
            // Iniciar com um jogo usando emojis por padrão
            initializeGame();
        });
    </script>
</body>
</html>
